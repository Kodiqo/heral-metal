- name: about
  label: 04 · За нас и сертификати
  type: file
  path: src/content/site.json
  format: json
  operations:
    create: false
    rename: false
    delete: false
  fields:
  - name: about
    label: За нас
    type: object
    fields:
    - name: mk
      label: Македонски
      type: object
      fields:
      - name: aboutTitle
        label: Наслов
        type: string
        required: true
        options:
          maxlength: 180
      - name: aboutBody
        label: Опис на компанијата
        type: text
        required: true
        options:
          maxlength: 2000
      - name: certificatesTitle
        label: Наслов за сертификатите
        type: string
        required: true
        options:
          maxlength: 200
      - name: certificatesBody
        label: Опис за сертификатите
        type: text
        required: true
        options:
          maxlength: 1000
    - name: en
      label: English
      type: object
      fields:
      - name: aboutTitle
        label: Наслов
        type: string
        required: true
        options:
          maxlength: 180
      - name: aboutBody
        label: Опис на компанијата
