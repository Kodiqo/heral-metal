- name: contact
  label: 05 · Контакт
  type: file
  path: src/content/site.json
  format: json
  operations:
    create: false
    rename: false
    delete: false
  fields:
  - name: business
    label: Контакт
    type: object
    fields:
    - name: email
      label: Јавна контактна е-пошта
      type: string
      required: true
      pattern:
        regex: ^[^\s@]+@[^\s@]+\.[^\s@]+$
        message: Внеси важечка е-пошта.
      description: Ја менува адресата за контакт на страницата. За промена на примачот на формуларот,
        побарај помош од одржувачот.
    - name: mk
      label: Македонски
      type: object
      fields:
      - name: note
        label: Напомена под е-поштата
        type: text
        required: false
        options:
          maxlength: 250
    - name: en
      label: English
      type: object
      fields:
      - name: note
        label: Напомена под е-поштата
        type: text
        required: false
        options:
          maxlength: 250
settings:
  hide: true
  content:
    merge: true
  commit:
    identity: app
    templates:
      update: 'content: update {name}'
