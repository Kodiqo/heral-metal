# Keep merge enabled: the small editors share one content file.
media:
- name: images
  label: Фотографии
  input: src/assets
  output: /src/assets
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  rename: random
- name: videos
  label: Видеа
  input: public/uploads/videos
  output: /uploads/videos
  extensions:
  - mp4
  rename: random
content:
- name: projects
  label: 01 · Проекти и нивни галерии
  type: file
  path: src/content/site.json
  format: json
  operations:
    create: false
    rename: false
    delete: false
  fields:
  - name: projects
    label: Проекти
    type: object
    list:
      max: 80
      collapsible:
        collapsed: true
        summary: '{fields.mk.title}'
    fields:
    - name: slug
      label: Линк на проектот
      type: string
      required: true
      description: Кратко име со латиница и цртички, на пример steel-structure-skopje. Задржи го истиот
        линк по објавувањето.
      pattern:
        regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        message: Користи мали латинични букви, бројки и цртички.
    - name: cover
      label: Насловна фотографија на проектот
      type: image
      required: true
      options:
        media: images
    - name: mk
      label: Македонски
      type: object
      fields:
      - name: title
        label: Име на проектот
        type: string
        required: true
        options:
          maxlength: 100
      - name: description
        label: Опис на проектот
        type: text
        required: false
        options:
          maxlength: 1500
    - name: en
      label: English
      type: object
      fields:
      - name: title
        label: Име на проектот
        type: string
        required: true
        options:
          maxlength: 100
      - name: description
        label: Опис на проектот
        type: text
        required: false
        options:
          maxlength: 1500
    - name: visible
      label: Прикажи го проектот
      type: boolean
      required: true
      default: true
    - name: media
      label: Фотографии и видеа во овој проект
      type: object
      list:
        max: 80
        collapsible:
          collapsed: true
          summary: '{fields.mk.title}'
      fields:
      - name: kind
        label: Вид на содржина
        type: select
        required: true
        default: image
        options:
          values:
          - value: image
            label: Фотографија
          - value: video
            label: Видео
      - name: image
        label: Фотографија / насловна фотографија
        type: image
        required: true
        options:
          media: images
        description: JPG, PNG или WebP. Препорачано до 2 MB, најмногу 5 MB. За видео, избери насловна
          фотографија.
      - name: video
        label: Видео снимка
        type: file
        required: false
        options:
          media: videos
          extensions:
          - mp4
        description: 'Само за видео: MP4 до 25 MB, препорачано до 20 MB.'
      - name: mk
        label: Македонски
        type: object
        fields:
        - name: title
          label: Наслов
          type: string
          required: true
          options:
            maxlength: 100
        - name: description
          label: Краток опис
          type: text
          required: false
          options:
            maxlength: 500
      - name: en
        label: English
        type: object
        fields:
        - name: title
          label: Наслов
          type: string
          required: true
          options:
            maxlength: 100
        - name: description
          label: Краток опис
          type: text
          required: false
          options:
            maxlength: 500
      - name: visible
        label: Прикажи на веб-страницата
        type: boolean
        required: true
        default: true
      - name: illustrative
        label: Илустративна содржина
        type: boolean
        required: true
        default: false
        description: Вклучи за примерни фотографии што не прикажуваат документиран завршен проект.
- name: home
  label: 02 · Почетна страница
  type: file
  path: src/content/site.json
  format: json
  operations:
    create: false
    rename: false
    delete: false
  fields:
  - name: home
    label: Главна фотографија и опис
    type: object
    fields:
    - name: image
      label: Главна фотографија
      type: image
      required: true
      options:
        media: images
      description: JPG, PNG или WebP. Препорачано до 2 MB, најмногу 5 MB.
    - name: mk
      label: Македонски
      type: object
      fields:
      - name: tagline
        label: Краток опис под насловот
        type: text
        required: true
        options:
          maxlength: 260
      - name: imageAlt
        label: Што има на фотографијата?
        type: text
        required: true
        options:
          maxlength: 180
    - name: en
      label: English
      type: object
      fields:
      - name: tagline
        label: Краток опис под насловот
        type: text
        required: true
        options:
          maxlength: 260
      - name: imageAlt
        label: Што има на фотографијата?
        type: text
        required: true
        options:
          maxlength: 180
